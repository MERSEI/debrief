[project]
name = "debrief"
version = "0.1.0"
description = "Двухдорожечная запись созвонов на Windows с разбором в структурированный протокол встречи"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.3.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
# PyAudioWPatch — форк PyAudio с поддержкой WASAPI loopback. Только Windows.
capture = ["PyAudioWPatch>=0.2.12.7; sys_platform == 'win32'"]
dev = ["pytest>=8.0"]

[project.scripts]
debrief = "debrief.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["debrief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
